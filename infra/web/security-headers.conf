# Güvenlik başlıkları. nginx'te bir location kendi add_header'ını tanımlarsa sunucu düzeyindekiler DEVRALINMAZ;
# bu yüzden bu dosya sunucu bloğunda ve add_header kullanan her location'da include edilir. $csp sunucu bloğunda tanımlıdır.
add_header Content-Security-Policy $csp always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy no-referrer always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# Tarayıcı özellikleri kapalı (kamera yalnız iOS uygulamasında); pencere ve kaynaklar başka kökenle paylaşılmaz (Spectre yalıtımı).
# COEP (require-corp) eklenmedi: PDF görüntüleyicinin blob: worker'ı ve IdP yönlendirmesiyle uyumu doğrulanmadı.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy same-origin always;
add_header Cross-Origin-Resource-Policy same-origin always;
