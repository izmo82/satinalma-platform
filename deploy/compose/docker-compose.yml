# Tek sunucuda tam yığın: kurum içi veri merkezi, sanal makine veya herhangi bir bulut VM'i.
# Bileşenler açık kaynak ve değiştirilebilir: PostgreSQL ↔ herhangi bir PostgreSQL 15+; SeaweedFS ↔ herhangi bir
# S3 uyumlu depo (Ceph RGW, MinIO, NetApp StorageGRID, bulut S3); Keycloak ↔ kurumun mevcut OIDC IdP'si.
# Kullanım: deploy/compose/README.md. TLS önündeki kurum ters vekilinde/yük dengeleyicisinde sonlanır.
name: satinalma

x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgres://sp_app:${APP_DB_PASSWORD:?}@db:5432/satinalma
  AUTH_MODE: oidc
  OIDC_ISSUER: ${OIDC_ISSUER:?}
  OIDC_AUDIENCE: ${OIDC_AUDIENCE:-sp-api}
  OIDC_JWKS_URL: ${OIDC_JWKS_URL:?}
  OIDC_DISCOVERY_URL: ${OIDC_DISCOVERY_URL:-}
  OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-sp-web}
  OIDC_SCOPE: ${OIDC_SCOPE:-}
  OIDC_RESOURCE: ${OIDC_RESOURCE:-}
  OIDC_TOKEN_ISSUER: ${OIDC_TOKEN_ISSUER:-}
  OIDC_SUBJECT_CLAIM: ${OIDC_SUBJECT_CLAIM:-}
  OIDC_EMAIL_CLAIM: ${OIDC_EMAIL_CLAIM:-}
  OIDC_TRUSTED_EMAIL_DOMAINS: ${OIDC_TRUSTED_EMAIL_DOMAINS:-}
  DATA_REGION: ${DATA_REGION:?}
  WEB_ORIGIN: ${SP_PUBLIC_URL:?}
  OBJECT_STORE_ENDPOINT: ${OBJECT_STORE_ENDPOINT:-http://objectstore:8333}
  OBJECT_STORE_REGION: ${OBJECT_STORE_REGION:-us-east-1}
  OBJECT_STORE_BUCKET: ${OBJECT_STORE_BUCKET:-sp-documents}
  OBJECT_STORE_FORCE_PATH_STYLE: ${OBJECT_STORE_FORCE_PATH_STYLE:-true}
  AWS_ACCESS_KEY_ID: ${OBJECT_STORE_ACCESS_KEY:?}
  AWS_SECRET_ACCESS_KEY: ${OBJECT_STORE_SECRET_KEY:?}
  SIGNATURE_DETECTOR_PROVIDER: ${SIGNATURE_DETECTOR_PROVIDER:-}
  ESIGN_VALIDATOR_PROVIDER: ${ESIGN_VALIDATOR_PROVIDER:-}

x-hardening: &hardening
  read_only: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  restart: unless-stopped

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sp_owner
      POSTGRES_PASSWORD: ${OWNER_DB_PASSWORD:?}
      POSTGRES_DB: satinalma
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-}
    volumes:
      - ./db-init:/docker-entrypoint-initdb.d:ro
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sp_owner -d satinalma"]
      interval: 3s
      retries: 40
    restart: unless-stopped

  objectstore:
    image: chrislusf/seaweedfs:4.51
    environment:
      S3_ACCESS_KEY: ${OBJECT_STORE_ACCESS_KEY:?}
      S3_SECRET_KEY: ${OBJECT_STORE_SECRET_KEY:?}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        printf '{"identities":[{"name":"sp-app","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json
        exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/tmp/s3.json -master.volumeSizeLimitMB=1024 -volume.max=0
    volumes:
      - object_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9333/cluster/status >/dev/null"]
      interval: 3s
      retries: 40
    restart: unless-stopped

  objectstore-init:
    image: amazon/aws-cli:2.38.6
    depends_on: { objectstore: { condition: service_healthy } }
    environment:
      AWS_ACCESS_KEY_ID: ${OBJECT_STORE_ACCESS_KEY:?}
      AWS_SECRET_ACCESS_KEY: ${OBJECT_STORE_SECRET_KEY:?}
      AWS_DEFAULT_REGION: us-east-1
      BUCKET: ${OBJECT_STORE_BUCKET:-sp-documents}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for i in $$(seq 1 30); do
          aws --endpoint-url http://objectstore:8333 s3api head-bucket --bucket "$$BUCKET" 2>/dev/null && exit 0
          aws --endpoint-url http://objectstore:8333 s3api create-bucket --bucket "$$BUCKET" && exit 0
          sleep 2
        done
        exit 1

  migrate:
    image: ${SP_API_IMAGE:-satinalma/api:local}
    command: ["node", "apps/api/dist/migrate.js"]
    environment:
      DATABASE_OWNER_URL: postgres://sp_owner:${OWNER_DB_PASSWORD:?}@db:5432/satinalma
    depends_on: { db: { condition: service_healthy } }
    <<: *hardening
    restart: "no"

  api:
    image: ${SP_API_IMAGE:-satinalma/api:local}
    environment: *app-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      objectstore-init: { condition: service_completed_successfully }
    <<: *hardening

  worker:
    image: ${SP_API_IMAGE:-satinalma/api:local}
    command: ["node", "--enable-source-maps", "apps/api/dist/worker.js"]
    environment: *app-env
    depends_on: { api: { condition: service_healthy } }
    healthcheck: { disable: true }
    <<: *hardening

  web:
    image: ${SP_WEB_IMAGE:-satinalma/web:local}
    environment:
      API_UPSTREAM: http://api:4100
      CSP_IDP_ORIGIN: ${CSP_IDP_ORIGIN:-}
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:8080"
    depends_on: { api: { condition: service_healthy } }
    read_only: true
    tmpfs: ["/tmp:uid=101,gid=101,mode=0700", "/etc/nginx/conf.d:uid=101,gid=101,mode=0700"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    restart: unless-stopped

  # Referans kimlik sağlayıcı (isteğe bağlı): kurumun mevcut IdP'si varsa bu profil açılmaz.
  #   docker compose --profile idp up -d
  idp:
    profiles: [idp]
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD gerekli (idp profili)}
      KC_HOSTNAME: ${IDP_PUBLIC_URL:-http://localhost:8180}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-kc-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD gerekli (idp profili)}
      SP_PUBLIC_URL: ${SP_PUBLIC_URL:?}
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    ports:
      - "${IDP_BIND:-127.0.0.1}:${IDP_PORT:-8180}:8080"
    depends_on: { db: { condition: service_healthy } }
    restart: unless-stopped

volumes:
  db_data:
  object_data:
