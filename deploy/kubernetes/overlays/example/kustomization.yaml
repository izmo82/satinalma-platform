# Örnek ortam katmanı: kendi kayıt defteriniz, alan adınız, IdP ve depo adresleriniz.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: satinalma
resources:
  - namespace.yaml
  - ../../base
  - egress-networkpolicy.yaml
# Kurum içi CA (IdP/PostgreSQL/S3 sertifikaları) kullanılıyorsa açın:
# components:
#   - ../../components/internal-ca
images:
  - name: satinalma/api
    newName: registry.example.test/satinalma/api
    newTag: "0.1.0"
  - name: satinalma/web
    newName: registry.example.test/satinalma/web
    newTag: "0.1.0"
patches:
  - target: { kind: ConfigMap, name: satinalma-config }
    patch: |-
      - { op: replace, path: /data/OIDC_ISSUER, value: "https://sso.kurum.example.test/realms/satinalma" }
      - { op: replace, path: /data/OIDC_JWKS_URL, value: "https://sso.kurum.example.test/realms/satinalma/protocol/openid-connect/certs" }
      - { op: replace, path: /data/WEB_ORIGIN, value: "https://satinalma.kurum.example.test" }
      - { op: replace, path: /data/OBJECT_STORE_ENDPOINT, value: "https://s3.kurum.example.test" }
  - target: { kind: Ingress, name: satinalma }
    patch: |-
      - { op: replace, path: /spec/tls/0/hosts/0, value: satinalma.kurum.example.test }
      - { op: replace, path: /spec/rules/0/host, value: satinalma.kurum.example.test }
