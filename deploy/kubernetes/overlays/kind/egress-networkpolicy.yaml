apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: satinalma-app-egress
spec:
  podSelector:
    matchExpressions:
      - { key: app.kubernetes.io/name, operator: In, values: [satinalma-api, satinalma-worker, satinalma-migrate, satinalma-provision] }
  policyTypes: [Egress]
  egress:
    - ports: [{ port: 53, protocol: UDP }, { port: 53, protocol: TCP }]
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: satinalma-deps } }
      ports: [{ port: 5432 }, { port: 8333 }, { port: 8080 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: satinalma-web-egress
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: satinalma-web }
  policyTypes: [Egress]
  egress:
    - ports: [{ port: 53, protocol: UDP }, { port: 53, protocol: TCP }]
    - to: [{ podSelector: { matchLabels: { app.kubernetes.io/name: satinalma-api } } }]
      ports: [{ port: 4100 }]
