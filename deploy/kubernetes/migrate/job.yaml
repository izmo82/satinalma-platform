apiVersion: batch/v1
kind: Job
metadata:
  name: satinalma-migrate
  labels: { app.kubernetes.io/name: satinalma-migrate, app.kubernetes.io/part-of: satinalma }
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: { app.kubernetes.io/name: satinalma-migrate }
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: migrate
          image: satinalma/api
          command: ["node", "apps/api/dist/migrate.js"]
          env:
            - { name: DATABASE_OWNER_URL, valueFrom: { secretKeyRef: { name: satinalma-migrate-secrets, key: DATABASE_OWNER_URL } } }
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 256Mi }
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
