apiVersion: apps/v1
kind: Deployment
metadata:
  name: satinalma-api
  labels: { app.kubernetes.io/name: satinalma-api, app.kubernetes.io/component: api }
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels: { app.kubernetes.io/name: satinalma-api }
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app.kubernetes.io/name: satinalma-api, app.kubernetes.io/component: api }
    spec:
      serviceAccountName: satinalma
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: { matchLabels: { app.kubernetes.io/name: satinalma-api } }
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: satinalma/api
          ports: [{ name: http, containerPort: 4100 }]
          envFrom:
            - configMapRef: { name: satinalma-config }
          env:
            - { name: DATABASE_URL, valueFrom: { secretKeyRef: { name: satinalma-secrets, key: DATABASE_URL } } }
            - { name: AWS_ACCESS_KEY_ID, valueFrom: { secretKeyRef: { name: satinalma-secrets, key: OBJECT_STORE_ACCESS_KEY } } }
            - { name: AWS_SECRET_ACCESS_KEY, valueFrom: { secretKeyRef: { name: satinalma-secrets, key: OBJECT_STORE_SECRET_KEY } } }
            # Web oturumu sunucuda (BFF): token şifreleme anahtarı.
            - { name: SESSION_SECRET, valueFrom: { secretKeyRef: { name: satinalma-secrets, key: SESSION_SECRET } } }
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 15
            failureThreshold: 4
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { memory: 512Mi }
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: { sizeLimit: 64Mi } }
---
apiVersion: v1
kind: Service
metadata:
  name: satinalma-api
  labels: { app.kubernetes.io/name: satinalma-api }
spec:
  selector: { app.kubernetes.io/name: satinalma-api }
  ports: [{ name: http, port: 4100, targetPort: http }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: satinalma-api
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: satinalma-api }
