# Ad alanında gelen trafik varsayılan kapalı; web dışarıdan, API yalnız web'den erişilir. Worker'a gelen trafik yok.
# Giden trafik (PostgreSQL, S3, IdP) kurum ağına göre overlay'de daraltılmalıdır.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: satinalma-default-deny-ingress
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: satinalma-web-ingress
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: satinalma-web }
  policyTypes: [Ingress]
  ingress:
    - ports: [{ port: 8080 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: satinalma-api-from-web
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: satinalma-api }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: satinalma-web }
      ports: [{ port: 4100 }]
