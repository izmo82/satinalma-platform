apiVersion: apps/v1
kind: Deployment
metadata:
  name: satinalma-web
  labels: { app.kubernetes.io/name: satinalma-web, app.kubernetes.io/component: web }
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels: { app.kubernetes.io/name: satinalma-web }
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app.kubernetes.io/name: satinalma-web, app.kubernetes.io/component: web }
    spec:
      serviceAccountName: satinalma
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: web
          image: satinalma/web
          ports: [{ name: http, containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: satinalma-web-config }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 15
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 128Mi }
          securityContext:
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: conf, mountPath: /etc/nginx/conf.d }
      volumes:
        - { name: tmp, emptyDir: { sizeLimit: 64Mi } }
        - { name: conf, emptyDir: { sizeLimit: 1Mi } }
---
apiVersion: v1
kind: Service
metadata:
  name: satinalma-web
  labels: { app.kubernetes.io/name: satinalma-web }
spec:
  selector: { app.kubernetes.io/name: satinalma-web }
  ports: [{ name: http, port: 8080, targetPort: http }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: satinalma-web
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: satinalma-web }
